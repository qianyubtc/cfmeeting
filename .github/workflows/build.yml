name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  web:
    name: Web (PWA + packaged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -w apps/web
      - run: npm run build:packaged -w apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            apps/web/dist
            apps/web/dist-packaged

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifacts: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: windows-latest
            script: dist:win
            artifacts: apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds; add signing secrets to enable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:packaged -w apps/web
      - run: npm run ${{ matrix.script }} -w apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifacts }}

  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build:packaged -w apps/web
      - run: npx cap sync android
        working-directory: apps/android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: apps/android/android
      - run: cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk CFMeeting-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: CFMeeting-debug.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/desktop-macos-latest/*
            artifacts/desktop-windows-latest/*
            artifacts/android-apk/*
